<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>TAICHI 2026 | 霹靂未來</title>
		<script>
			// GitHub Pages SPA redirect hack
			// When a page is loaded directly (not through client-side routing),
			// this script captures the intended path and redirects to index.html
			// with the path stored in sessionStorage
			var fullPath = location.pathname + location.search + location.hash;
			// Remove the base path /taichi-2026/ to get the actual route
			var basePath = '/taichi-2026/';
			var route = fullPath.replace(basePath, '/');
			sessionStorage.setItem('redirect', route);
		</script>
		<meta http-equiv="refresh" content="0;URL='/taichi-2026/'"></meta>
	</head>
	<body></body>
</html>
