<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>TAICHI 2026 | Big Bang Future</title>
		<script>
			// GitHub Pages SPA redirect hack
			// Automatically detect base path for both custom domain and subdirectory deployments
			(function () {
				var path = window.location.pathname;
				var hash = window.location.hash;
				var search = window.location.search;

				// Auto-detect base path
				// If we're on a custom domain (e.g., taichi2026.taiwanchi.org), basePath is '/'
				// If we're on GitHub Pages subdirectory (e.g., miislab.github.io/taichi-2026/), basePath is '/taichi-2026/'
				var basePath = '/';
				if (path.indexOf('/') === 0) {
					basePath = '/';
				}

				// Get the route relative to basePath
				var route = path.replace(basePath, '/') + search + hash;

				// Store it for index.html to pick up
				sessionStorage.setItem('redirect', route);

				// Redirect to the base URL
				window.location.href = basePath;
			})();
		</script>
	</head>
	<body></body>
</html>
