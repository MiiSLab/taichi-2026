<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>TAICHI 2026 | Big Bang Future</title>
		<script>
			// Fallback for unknown URLs (typos, deleted pages). Known SPA routes
			// are pre-built into <route>/index.html by vite.config.ts and never
			// reach this file. For anything else, capture the requested path so
			// the SPA can show the correct 404 page after redirecting to '/'.
			(function () {
				var route = window.location.pathname + window.location.search + window.location.hash;
				sessionStorage.setItem('redirect', route);
				window.location.href = '/';
			})();
		</script>
	</head>
	<body></body>
</html>
