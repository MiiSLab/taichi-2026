		<!-- Font loading overlay: hides FOUC until web fonts are ready -->
		<div
			id="font-loader"
			style="
				position: fixed;
				inset: 0;
				background: #050505;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 0.4s ease;
			"
		>
			<div
				style="
					font-family: monospace;
					color: #a8f020;
					font-size: 1.5rem;
					letter-spacing: 0.3em;
					animation: pulse 1s ease-in-out infinite alternate;
				"
			>
				TAICHI'26
			</div>
		</div>
		<style>
			@keyframes pulse {
				from {
					opacity: 0.4;
				}
				to {
					opacity: 1;
				}
			}
		</style>
		<script>
			(function () {
				var loader = document.getElementById('font-loader');
				if (!loader) return;
				var hidden = false;
				function hide() {
					if (hidden) return;
					hidden = true;
					loader.style.opacity = '0';
					setTimeout(function () {
						loader.style.display = 'none';
					}, 420);
				}
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(hide);
				}
				// Hard cap: never block first paint longer than 1.5s, even if fonts fail.
				setTimeout(hide, 1500);
			})();
		</script>

		<div id="root"></div>
	</body>
