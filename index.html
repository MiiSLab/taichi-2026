		<script>
			// Restore the intended path after redirect from 404.html
			(function () {
				var redirect = sessionStorage.getItem('redirect');
				if (redirect && redirect !== '/') {
					sessionStorage.removeItem('redirect');
					// Don't use history.replaceState here, let React Router handle it
					// Just keep the redirect in a global variable for React Router to pick up
					window.__INITIAL_REDIRECT__ = redirect;
				}
			})();

	<body>
		<!-- Font loading overlay: hides FOUC until web fonts are ready -->
		<div
			id="font-loader"
			style="
				position: fixed;
				inset: 0;
				background: #050505;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 0.4s ease;
			"
		>
			<div
				style="
					font-family: monospace;
					color: #a8f020;
					font-size: 1.5rem;
					letter-spacing: 0.3em;
					animation: pulse 1s ease-in-out infinite alternate;
				"
			>
				TAICHI'26
			</div>
		</div>
		<style>
			@keyframes pulse {
				from {
					opacity: 0.4;
				}
				to {
					opacity: 1;
				}
			}
		</style>
		<script>
			document.fonts.ready.then(function () {
				var loader = document.getElementById('font-loader');
				if (loader) {
					loader.style.opacity = '0';
					setTimeout(function () {
						loader.style.display = 'none';
					}, 420);
				}
			});
		</script>
